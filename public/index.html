<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; color: #111; }
    header { padding: 3rem 1rem; text-align: center; background: #f5f5f5; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    p.subtitle { color: #555; font-size: 1.1rem; }
    nav { margin-top: 2rem; }
    nav a { margin: 0 1rem; color: #0066cc; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 720px; margin: 3rem auto; padding: 0 1rem; }
    section { margin-bottom: 2rem; }
    h2 { font-size: 1.5rem; margin-bottom: 0.75rem; border-bottom: 2px solid #eee; padding-bottom: 0.25rem; }
    ul { list-style: disc inside; gap: 0.5rem; }
    footer { text-align: center; padding: 2rem; color: #777; font-size: 0.9rem; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <header>
    <h1>Portfolio Hub</h1>
    <p class="subtitle">Projects, writing, and work</p>
    <nav>
      <a href="#projects">Projects</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <main>
    <section id="projects">
      <h2>Projects</h2>
      <ul>
        <li><strong>AtlasOps</strong> — Next.js + OpenNext on Cloudflare Workers</li>
      </ul>
    </section>
    <section id="about">
      <h2>About</h2>
      <p>Welcome to the portfolio hub.</p>
    </section>
    <section id="contact">
      <h2>Contact</h2>
      <p>Reach out via GitHub or email.</p>
    </section>
  </main>
  <footer>
    &copy; 2026 Portfolio Hub
  </footer>
</body>
</html>
